name: Evaluate answer quality

# Runs the full eval (real Claude calls, costs a few cents) only when started
# by hand from the Actions tab, so ordinary pushes don't spend API credits.
# Requires an ANTHROPIC_API_KEY repository secret.
on:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evaluation suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python eval/evaluate.py
